[project]
name = "mlops2"
version = "0.1.0"
description = "API de santé et accès au modèle de scoring"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "lightgbm>=4.5",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --cov --cov-report=term-missing --cov-report=html:tests/htmlcov"

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]
data_file = "tests/.coverage"
branch = true

[tool.coverage.report]
show_missing = true
